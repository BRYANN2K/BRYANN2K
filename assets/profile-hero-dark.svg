  <path d="M20 367.5H1260" stroke="#34394D"/>
  <text x="67" y="393" fill="#858DA3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.35">HOMELAB SINCE 2009</text>
  <circle cx="247" cy="389" r="2" fill="#51576B"/>
  <text x="263" y="393" fill="#858DA3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.35">OPEN SOURCE</text>
  <circle cx="388" cy="389" r="2" fill="#51576B"/>
  <text x="404" y="393" fill="#858DA3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.35">NO LOCK-IN</text>
  <text x="1081" y="393" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">BRYANN2K.DEV ↗</text>

    <rect x="1011" y="177" width="117" height="28" rx="6" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.40"/>
    <text x="1026" y="195" fill="#D6CBFF">reviewed change</text>
  </g>

  <path d="M819 220.5H1195" stroke="#2D3244"/>
  <circle cx="824" cy="244" r="4" fill="#F2B86D" filter="url(#nodeGlow)"/>
  <text x="838" y="249" fill="#F3F1FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">STACKDEPLOY</text>
  <rect x="1105" y="232" width="90" height="23" rx="11.5" fill="#F2B86D" fill-opacity="0.10" stroke="#F2B86D" stroke-opacity="0.38"/>
  <text x="1125" y="247.5" fill="#F4C98F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">IN BUILD</text>


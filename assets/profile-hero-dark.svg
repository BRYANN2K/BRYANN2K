  <circle cx="83" cy="108.5" r="3.5" fill="#A78BFA"/>
  <text x="95" y="113.5" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.1">BRYANN2K / BELGIUM</text>

  <text x="67" y="177" fill="#F7F7FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="51" font-weight="750" letter-spacing="-1.8">SYSTEMS OPERATOR</text>
  <text x="67" y="235" fill="#A78BFA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="51" font-weight="750" letter-spacing="-1.8">→ PRODUCT BUILDER</text>
  <text x="69" y="276" fill="#AEB5C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">I build tools and infrastructure that keep developers in control.</text>


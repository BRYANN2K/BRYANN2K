<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Available">
  <style>
    .ring { transform-origin: 12px 12px; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .5 } 70%, 100% { transform: scale(2.6); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: 0 } }
  </style>
  <circle class="ring" cx="12" cy="12" r="4.5" fill="#2da44e"/>
  <circle cx="12" cy="12" r="4.5" fill="#2da44e"/>
</svg>

  <text x="838" y="249" fill="#191B23" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">STACKDEPLOY</text>
  <rect x="1105" y="232" width="90" height="23" rx="11.5" fill="#D98A27" fill-opacity="0.08" stroke="#D98A27" stroke-opacity="0.30"/>
  <text x="1125" y="247.5" fill="#A45E09" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">IN BUILD</text>


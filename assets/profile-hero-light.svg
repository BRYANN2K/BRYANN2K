  <text x="404" y="393" fill="#73798A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.35">NO LOCK-IN</text>
  <text x="1081" y="393" fill="#7C3AED" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">BRYANN2K.DEV ↗</text>

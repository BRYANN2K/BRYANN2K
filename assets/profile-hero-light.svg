  <path d="M20 367.5H1260" stroke="#DDD8EC"/>
  <text x="67" y="393" fill="#73798A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.35">HOMELAB SINCE 2009</text>
  <circle cx="247" cy="389" r="2" fill="#B3AFC0"/>
  <text x="263" y="393" fill="#73798A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.35">OPEN SOURCE</text>

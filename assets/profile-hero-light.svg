<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">BRYANN2K — systems operator to product builder</title>
  <desc id="desc">A light operator console showing Bryan's work on Maestro and StackDeploy.</desc>
  <defs>
    <linearGradient id="background" x1="20" y1="20" x2="1260" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFCFE"/>
      <stop offset="1" stop-color="#F2EFFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1030 168) rotate(147) scale(560 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6D28D9" stroke-opacity="0.055"/>
    </pattern>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="1240" height="390" rx="26" fill="url(#background)"/>
  <rect x="20" y="20" width="1240" height="390" rx="26" fill="url(#glow)"/>
  <rect x="20" y="20" width="1240" height="390" rx="26" fill="url(#grid)"/>
  <rect x="20.5" y="20.5" width="1239" height="389" rx="25.5" fill="none" stroke="#DDD8EC"/>

  <path d="M20 67.5H1260" stroke="#DDD8EC"/>
  <circle cx="50" cy="44" r="5" fill="#E86C6C"/>
  <circle cx="69" cy="44" r="5" fill="#E6A750"/>
  <circle cx="88" cy="44" r="5" fill="#36B77A"/>
  <text x="110" y="50" fill="#73798A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">~/BRYANN2K</text>
  <circle cx="1112" cy="44" r="4" fill="#28A96D" filter="url(#nodeGlow)"/>
  <text x="1124" y="49" fill="#575E70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.4">SYSTEMS ONLINE</text>


# Port of .github/workflows/commit-invaders.yml. Runs the pinned action's
# bundle directly (it reads INPUT_* like GitHub does) from a Woodpecker cron
# named commit-invaders (17 3 * * *). It force-pushes the SVGs to `output`.
when:
  - event: [cron, manual]
    branch: main

steps:
  - name: generate
    image: docker.io/library/node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    environment:
      GIT_PUSH_TOKEN:
        from_secret: git_push_token
      INPUT_GITHUB_USER_NAME: BRYANN2K
      INPUT_OUTPUT_BRANCH: output
      INPUT_OUTPUT_FILE: commit-invaders.svg
      INPUT_NO_SCOREBOARD: "true"
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - git init -q /tmp/action
      - git -C /tmp/action fetch -q --depth 1 https://github.com/Goblinlordx/commit-invaders.git 49ce2ef7dd90272cd98dd06ab39dfeede05897c6
      - git -C /tmp/action checkout -q FETCH_HEAD
      - test "$(git -C /tmp/action rev-parse HEAD)" = 49ce2ef7dd90272cd98dd06ab39dfeede05897c6
      - git remote set-url origin "https://x-access-token:$GIT_PUSH_TOKEN@github.com/$CI_REPO.git"
      - git fetch -q origin "+refs/heads/output:refs/remotes/origin/output" || true
      - INPUT_GITHUB_TOKEN="$GIT_PUSH_TOKEN" GITHUB_OUTPUT=/tmp/gh-output GITHUB_STEP_SUMMARY=/tmp/gh-summary node /tmp/action/dist/index.cjs
